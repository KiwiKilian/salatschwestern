name: salatschwestern-backend-production

services:
  node:
    build: .
    env_file: .env
    ports:
      - 8080:8080
    depends_on:
      - postgres
    restart: unless-stopped
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      LANG: de_AT.utf8
      TZ: Europe/Vienna
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
